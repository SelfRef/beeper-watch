name: Build image

# Builds ghcr.io/selfref/beeper-watch:latest — the event watcher the patched
# Beeper bridges report to (see README.md).
#
# The tests run inside the built image rather than against a separate
# environment, so what is verified is exactly what ships: same Python, same
# pinned dependencies. The rule matcher is where a mistake is silent — a wrong
# filter does not crash, it just never fires — so the suite is a release gate,
# not a nicety, and the image is not pushed if it fails.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, Monday. The base image (python:3.12-slim) gets security updates
    # between releases, and nothing here pins it by digest.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        run: docker build --check .

      # GHCR requires lowercase names; github.repository may contain uppercase.
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest is the only published tag. :pr-<n> exists so pull-request
      # builds have a name for the tests below to run against; they never push.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=beeper-watch
            org.opencontainers.image.description=Filter self-hosted Beeper bridge events and notify n8n

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMG="$(echo "$TAGS" | head -n1)"
          docker run --rm -v "$PWD:/src" -w /src "$IMG" \
            sh -c 'pip install --no-cache-dir --quiet pytest==9.1.1 && python -m pytest -q tests/'

      # The image is only useful if it serves all three surfaces, so assert
      # that rather than only that it starts: ingest, the REST admin API and
      # the MCP endpoint (which is a mounted app and the easiest to break).
      - name: Smoke test
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMG="$(echo "$TAGS" | head -n1)"
          docker run -d --name watch -p 8080:8080 \
            -e BEEPER_WATCH_TOKEN=admin -e BEEPER_WATCH_INGEST_TOKEN=ingest "$IMG"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"status":"ok"' \
            || { echo "::error::health check failed"; docker logs watch; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/rules)
          [ "$code" = "401" ] || { echo "::error::admin API is not protected (got $code)"; exit 1; }

          curl -fsS -X POST http://127.0.0.1:8080/v1/rules \
            -H 'Authorization: Bearer admin' -H 'Content-Type: application/json' \
            -d '{"name":"smoke","match":{"contains":"ping"},"action":{"webhook_url":"http://127.0.0.1:9/none"}}' >/dev/null

          out=$(curl -fsS -X POST http://127.0.0.1:8080/v1/events \
            -H 'Authorization: Bearer ingest' -H 'Content-Type: application/json' \
            -d '{"schema":1,"network":"telegram","kind":"message","room_id":"!r:beeper.local","event_id":"$1","sender":"@sh-telegram_1:beeper.local","body":"ping"}')
          echo "$out" | grep -q '"matched":\["smoke"\]' \
            || { echo "::error::rule did not match: $out"; exit 1; }

          # A future payload version must be refused, not half-understood.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/events \
            -H 'Authorization: Bearer ingest' -H 'Content-Type: application/json' \
            -d '{"schema":99,"network":"x","kind":"message","event_id":"$2"}')
          [ "$code" = "400" ] || { echo "::error::unknown event schema accepted (got $code)"; exit 1; }

          mcp=$(curl -fsS -X POST http://127.0.0.1:8080/mcp \
            -H 'Authorization: Bearer admin' -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
          echo "$mcp" | grep -q 'create_rule' \
            || { echo "::error::MCP endpoint did not list tools: $mcp"; docker logs watch; exit 1; }
          echo "smoke OK"
          docker rm -f watch >/dev/null

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
